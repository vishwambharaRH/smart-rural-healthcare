<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Access Denied - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-gradient" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 text-center">
                <div class="card shadow-lg border-0" style="border-radius: 20px;">
                    <div class="card-body p-5">
                        <i class="bi bi-shield-exclamation display-1 text-danger mb-4"></i>
                        <h1 class="fw-bold mb-3">Access Denied</h1>
                        <p class="lead text-muted mb-4">Sorry, you don't have permission to access this page.</p>
                        <p class="text-danger" th:text="${errorMessage}">You do not have the required role for this action.</p>
                        <p><small>Requested: <span th:text="${deniedUrl}" class="fw-semibold"></span></small></p>
                        <div class="mt-4">
                            <a href="/" class="btn btn-primary btn-lg me-3">
                                <i class="bi bi-house"></i> Home
                            </a>
                            <a href="/logout" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-box-arrow-right"></i> Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

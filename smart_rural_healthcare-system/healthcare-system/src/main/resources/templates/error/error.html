 <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                        <h2 class="mt-3">Something went wrong</h2>
                        <p class="text-muted">An error occurred while processing your request. Please try again later.</p>
                        <p class="text-danger" th:if="${status}" th:text="'Status: ' + ${status}">Status</p>
                        <p class="text-danger" th:if="${error}" th:text="'Error: ' + ${error}">Error</p>
                        <p class="text-danger" th:if="${message}" th:text="'Message: ' + ${message}">Message</p>
                        <div class="mt-4">
                            <a href="/" class="btn btn-primary">
                                <i class="bi bi-house"></i> Home
                            </a>
                            <a href="/logout" class="btn btn-secondary">
                                Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

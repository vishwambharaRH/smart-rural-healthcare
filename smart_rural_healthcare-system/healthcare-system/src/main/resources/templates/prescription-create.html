<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Prescription - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/dashboard">Inventory</a>
                <a class="nav-link" href="/prescription/list">Prescriptions</a>
                <a class="nav-link" href="/diagnosis/list">Diagnoses</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-file-earmark-plus"></i> Create Prescription
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <strong>Diagnosis:</strong> <span th:text="${diagnosis.diagnosis}">-</span><br/>
                            <small>Symptoms: <span th:text="${diagnosis.symptoms}">-</span></small>
                        </div>

                        <form method="POST" action="/prescription/create">
                            <input type="hidden" name="diagnosisId" th:value="${diagnosis.id}">

                            <div class="mb-3">
                                <label for="medicines" class="form-label">Medicines (comma-separated)</label>
                                <textarea name="medicines" class="form-control" id="medicines" rows="3" placeholder="e.g., Aspirin 500mg, Paracetamol 500mg" required></textarea>
                                <small class="text-muted">List all medicines to be prescribed</small>
                            </div>

                            <div class="mb-3">
                                <label for="dosage" class="form-label">Dosage</label>
                                <input type="text" name="dosage" class="form-control" id="dosage" placeholder="e.g., 1 tablet twice a day" required>
                            </div>

                            <div class="mb-3">
                                <label for="instructions" class="form-label">Special Instructions</label>
                                <textarea name="instructions" class="form-control" id="instructions" rows="3" placeholder="e.g., Take after meals, avoid dairy products"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="durationDays" class="form-label">Duration (Days)</label>
                                <input type="number" name="durationDays" class="form-control" id="durationDays" min="1" value="7" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Create Prescription
                                </button>
                                <a href="/diagnosis/list" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

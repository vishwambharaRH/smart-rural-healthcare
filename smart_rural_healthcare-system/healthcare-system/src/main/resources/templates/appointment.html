<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/dashboard}">Patients</a>
                <a class="nav-link" href="/doctors">Doctors</a>
                <a class="nav-link active" href="/appointments">Appointments</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="bi bi-calendar-check text-primary"></i> Appointments</h2>
                    <a href="/appointments/new" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Schedule Appointment
                    </a>
                </div>

                <div th:if="${#lists.isEmpty(listAppointments)}">
                    <div class="alert alert-info">
                        <i class="bi bi-calendar-x"></i> No appointments scheduled. <a href="/appointments/new">Schedule first appointment</a>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover" th:if="${not #lists.isEmpty(listAppointments)}">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Patient</th>
                                <th>Doctor</th>
                                <th>Date</th>
                                <th>Reason</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="appointment : ${listAppointments}">
                                <td th:text="${appointment.id}"></td>
                                <td>
                                    <strong th:text="${appointment.patient.name}"></strong>
                                    <br><small class="text-muted" th:text="${appointment.patient.village}"></small>
                                </td>
                                <td>
                                    <strong th:text="${appointment.doctor.name}"></strong>
                                    <br><small class="text-muted" th:text="${appointment.doctor.specialty}"></small>
                                </td>
                                <td th:text="${appointment.appointmentDate}"></td>
                                <td th:text="${appointment.reason}"></td>
                                <td>
                                    <span class="badge" 
                                          th:text="${appointment.status}"
                                          th:classappend="${appointment.status == 'APPROVED' ? 'bg-success' : appointment.status == 'PENDING' ? 'bg-warning' : 'bg-danger'}"></span>
                                </td>
                                <td>
                                    <div class="btn-group-vertical btn-group-sm w-100" role="group">
                                        <a th:href="@{/appointments/edit/{id}(id=${appointment.id})}" class="btn btn-outline-primary btn-sm">
                                            <i class="bi bi-pencil"></i> Edit
                                        </a>
                                        <a th:href="@{/prescription/create-from-appointment/{id}(id=${appointment.id})}" class="btn btn-outline-success btn-sm" title="Generate prescription for this patient">
                                            <i class="bi bi-file-earmark-pdf"></i> Rx
                                        </a>
                                        <a th:href="@{/reports/patient/{id}/download(id=${appointment.patient.id})}" class="btn btn-outline-info btn-sm" title="Download patient report">
                                            <i class="bi bi-download"></i> Report
                                        </a>
                                        <a th:href="@{/appointments/{id}(id=${appointment.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure?')">
                                            <i class="bi bi-trash"></i> Delete
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

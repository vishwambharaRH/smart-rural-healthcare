<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Diagnosis Details - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/dashboard">Inventory</a>
                <a class="nav-link" href="/prescription/list">Prescriptions</a>
                <a class="nav-link" href="/diagnosis/list">Diagnoses</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Diagnosis Details</h4>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <tr>
                                <th>Diagnosis:</th>
                                <td th:text="${diagnosis.diagnosis}">-</td>
                            </tr>
                            <tr>
                                <th>Symptoms:</th>
                                <td th:text="${diagnosis.symptoms}">-</td>
                            </tr>
                            <tr>
                                <th>Notes:</th>
                                <td th:text="${diagnosis.notes}">-</td>
                            </tr>
                            <tr>
                                <th>Prescription:</th>
                                <td>
                                    <span th:if="${diagnosis.prescription != null}">
                                        <a th:href="@{/prescription/view/{id}(id=${diagnosis.prescription.id})}" class="btn btn-sm btn-success">
                                            View Prescription
                                        </a>
                                    </span>
                                    <span th:unless="${diagnosis.prescription != null}">
                                        <span class="badge bg-warning">Not yet prescribed</span>
                                    </span>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Actions</h5>
                    </div>
                    <div class="card-body">
                        <a th:href="@{/diagnosis/edit/{id}(id=${diagnosis.id})}" class="btn btn-warning btn-block w-100 mb-2">
                            <i class="bi bi-pencil"></i> Edit
                        </a>

                        <a th:href="@{/prescription/create/{diagnosisId}(diagnosisId=${diagnosis.id})}" 
                           th:if="${diagnosis.prescription == null}"
                           class="btn btn-success w-100 mb-2">
                            <i class="bi bi-file-earmark-plus"></i> Create Prescription
                        </a>
                        
                        <form method="POST" th:action="@{/diagnosis/delete/{id}(id=${diagnosis.id})}" class="mb-2">
                            <button type="submit" class="btn btn-danger w-100" onclick="return confirm('Are you sure?')">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>

                        <a href="/diagnosis/list" class="btn btn-secondary w-100">
                            <i class="bi bi-arrow-left"></i> Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

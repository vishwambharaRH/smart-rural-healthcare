<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventory Dashboard - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .card-stat { border-left: 5px solid #0d6efd; }
        .card-stat.warning { border-left-color: #ffc107; }
        .stat-value { font-size: 2rem; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/list">Inventory</a>
                <a class="nav-link" href="/inventory/low-stock">Low Stock</a>
                <a class="nav-link" href="/prescription/list">Prescriptions</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4"><i class="bi bi-boxes text-primary"></i> Inventory Dashboard</h2>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card card-stat shadow-sm">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Total Medicines</h6>
                        <div class="stat-value text-primary"><span th:text="${totalMedicines}">0</span></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat warning shadow-sm">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted">Low Stock Items</h6>
                        <div class="stat-value text-warning"><span th:text="${lowStockCount}">0</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Low Stock Medicines (Qty < 10)</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(lowStockMedicines)}" class="alert alert-info">
                            All medicines are adequately stocked.
                        </div>
                        <ul class="list-group" th:unless="${#lists.isEmpty(lowStockMedicines)}">
                            <li class="list-group-item" th:each="med : ${lowStockMedicines}">
                                <strong th:text="${med.medicineName}">Medicine</strong><br/>
                                <small class="text-muted">Qty: <span th:text="${med.quantity}">0</span> | Location: <span th:text="${med.location}">-</span></small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white d-flex justify-content-between">
                        <h5 class="mb-0">Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <a href="/inventory/create" class="btn btn-primary btn-sm w-100 mb-2">
                            <i class="bi bi-plus-circle"></i> Add New Medicine
                        </a>
                        <a href="/inventory/list" class="btn btn-info btn-sm w-100 mb-2">
                            <i class="bi bi-list-ul"></i> View All Medicines
                        </a>
                        <a href="/inventory/low-stock" class="btn btn-warning btn-sm w-100">
                            <i class="bi bi-exclamation-triangle"></i> Low Stock Items
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

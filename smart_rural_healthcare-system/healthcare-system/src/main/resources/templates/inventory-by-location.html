<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Medicines by Location - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/dashboard">Dashboard</a>
                <a class="nav-link" href="/inventory/list">Inventory</a>
                <a class="nav-link" href="/prescription/list">Prescriptions</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">
            <i class="bi bi-geo-alt text-primary"></i> Medicines at <span th:text="${location}">Location</span>
        </h2>

        <div th:if="${#lists.isEmpty(medicines)}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> No medicines available at this location.
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(medicines)}">
            <table class="table table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Medicine Name</th>
                        <th>Batch Number</th>
                        <th>Quantity</th>
                        <th>Specialty</th>
                        <th>Expiry Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="med : ${medicines}" th:classappend="${med.quantity < 10 ? 'table-warning' : ''}">
                        <td th:text="${med.medicineName}">Medicine</td>
                        <td th:text="${med.batchNumber}">-</td>
                        <td th:text="${med.quantity}">0</td>
                        <td th:text="${med.specialty}">-</td>
                        <td th:text="${med.expiryDate}">-</td>
                        <td>
                            <a th:href="@{/inventory/view/{id}(id=${med.id})}" class="btn btn-sm btn-info">
                                <i class="bi bi-eye"></i> View
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-3">
            <a href="/inventory/dashboard" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

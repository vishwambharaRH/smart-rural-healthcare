<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Diagnoses - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/dashboard">Inventory</a>
                <a class="nav-link" href="/prescription/list">Prescriptions</a>
                <a class="nav-link active" href="/diagnosis/list">Diagnoses</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h2><i class="bi bi-clipboard2-check text-primary"></i> Diagnoses</h2>
                    <a href="/diagnosis/create" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> New Diagnosis
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(diagnoses)}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> No diagnoses found. <a href="/diagnosis/create">Create one</a>
        </div>

        <div class="row" th:unless="${#lists.isEmpty(diagnoses)}">
            <div class="col-md-6" th:each="diag : ${diagnoses}">
                <div class="card mb-3 shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="mb-0" th:text="${diag.diagnosis}">Diagnosis</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2">
                            <strong>Symptoms:</strong><br/>
                            <span th:text="${diag.symptoms}">-</span>
                        </p>
                        <p class="mb-3">
                            <strong>Notes:</strong><br/>
                            <span th:text="${diag.notes}">-</span>
                        </p>
                        <div class="btn-group w-100">
                            <a th:href="@{/diagnosis/view/{id}(id=${diag.id})}" class="btn btn-sm btn-info">
                                <i class="bi bi-eye"></i> View
                            </a>
                            <a th:href="@{/prescription/create/{diagnosisId}(diagnosisId=${diag.id})}" class="btn btn-sm btn-success">
                                <i class="bi bi-file-earmark-plus"></i> Create Rx
                            </a>
                            <a th:href="@{/diagnosis/edit/{id}(id=${diag.id})}" class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

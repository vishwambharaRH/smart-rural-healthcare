<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smart Rural Healthcare - Register</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; }
        .register-card { backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container d-flex align-items-center justify-content-center min-vh-100 pt-5 mt-5">
        <div class="row w-100 justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card register-card p-5">
                    <div class="text-center mb-5">
                        <i class="bi bi-person-plus-fill display-1 text-success mb-3"></i>
                        <h1 class="fw-bold mb-1">Create Account</h1>
                        <p class="text-muted">Join our rural healthcare community</p>
                    </div>

                    <form th:action="@{/register}" method="post" th:object="${user}">
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" th:field="*{name}" placeholder="Enter name" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
                                    <input type="text" class="form-control" th:field="*{username}" placeholder="Choose username" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold">Phone</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                    <input type="tel" class="form-control" th:field="*{phone}" placeholder="Phone number" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold">Village</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                    <input type="text" class="form-control" th:field="*{village}" placeholder="Your village" required>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" th:field="*{password}" placeholder="Create password" required>
                            </div>
                        </div>
                        <div class="row mb-4">
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="role-user" name="role" value="USER" th:checked="${user?.role == 'USER'}" required>
                                    <label class="form-check-label fw-semibold" for="role-user">
                                        Patient/User
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="role-healthworker" name="role" value="HEALTHWORKER" th:checked="${user?.role == 'HEALTHWORKER'}" required>
                                    <label class="form-check-label fw-semibold" for="role-healthworker">
                                        Health Worker
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="role-doctor" name="role" value="DOCTOR" th:checked="${user?.role == 'DOCTOR'}" required>
                                    <label class="form-check-label fw-semibold" for="role-doctor">
                                        Doctor
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div th:if="${msg != null}" class="alert alert-success">
                            [[${msg}]]
                        </div>
                        <div class="d-grid gap-2 mb-4">
                            <button type="submit" class="btn btn-success btn-lg fw-semibold">
                                <i class="bi bi-person-plus me-2"></i>Create Account
                            </button>
                        </div>
                        <div class="text-center">
                            <a href="/login" class="text-decoration-none">Already have account? Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

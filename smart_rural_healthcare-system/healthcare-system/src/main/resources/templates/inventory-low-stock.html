<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Low Stock Medicines - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/dashboard">Dashboard</a>
                <a class="nav-link" href="/inventory/list">Inventory</a>
                <a class="nav-link" href="/prescription/list">Prescriptions</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <h2><i class="bi bi-exclamation-triangle text-warning"></i> Low Stock Medicines</h2>
                <p class="text-muted">Medicines with quantity less than 10 units</p>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(medicines)}" class="alert alert-success">
            <i class="bi bi-check-circle"></i> All medicines are adequately stocked!
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(medicines)}">
            <table class="table table-hover table-warning">
                <thead class="table-dark">
                    <tr>
                        <th>Medicine Name</th>
                        <th>Batch Number</th>
                        <th>Current Quantity</th>
                        <th>Location</th>
                        <th>Specialty</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="med : ${medicines}">
                        <td><strong th:text="${med.medicineName}">-</strong></td>
                        <td th:text="${med.batchNumber}">-</td>
                        <td>
                            <span class="badge bg-warning text-dark" th:text="${med.quantity}">0</span>
                        </td>
                        <td th:text="${med.location}">-</td>
                        <td th:text="${med.specialty}">-</td>
                        <td>
                            <a th:href="@{/inventory/view/{id}(id=${med.id})}" class="btn btn-sm btn-info">
                                <i class="bi bi-eye"></i> View
                            </a>
                            <a th:href="@{/inventory/edit/{id}(id=${med.id})}" class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-3">
            <a href="/inventory/dashboard" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Dashboard - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%); min-height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 pt-4">
        <h1 class="text-primary mb-4">
            <i class="bi bi-stethoscope"></i> Doctor Dashboard
        </h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">

<div class="card-header">
                        <h5><i class="bi bi-calendar-x"></i> Pending Appointments</h5>
                    </div>
<div class="card-body">
                        <div th:each="appointment : ${pendingAppointments}" class="mb-3 p-3 border rounded">
                            <h6>Patient: <span th:text="${appointment.patient?.name ?: 'Unknown'}"></span></h6>
                            <p>Username: <span th:text="${appointment.patient?.username ?: 'Unknown'}"></span></p>
                            <p>Date: <span th:text="${appointment.appointmentDate}"></span> | Reason: <span th:text="${appointment.reason}"></span></p>
                            <p>Status: <span class="badge bg-warning" th:text="${appointment.status}"></span></p>
                            <div>
                                <a th:href="@{/appointments/{id}/approve(id=${appointment.id})}" class="btn btn-success btn-sm me-2">Approve</a>
                                <a th:href="@{/appointments/{id}/reject(id=${appointment.id})}" class="btn btn-danger btn-sm">Reject</a>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(pendingAppointments)}" class="text-muted">
                            No pending appointments.
                        </div>

                        </div>

                    </div>
                </div>
            </div>
<div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-plus-circle"></i> Quick Actions</h5>
                    </div>
                    <div class="card-body">
<a href="/patients/doctor/add" class="btn btn-success w-100 mb-2">Add Patient</a>
                        <a href="/appointments" class="btn btn-info w-100">View Appointments</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patients Section -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-people"></i> Patients</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${patients.isEmpty()}">No patients added yet.</div>
                        <div th:each="patient : ${patients}" class="mb-3 p-3 border rounded">
                            <h6 th:text="${patient.name}"></h6>
                            <p>Age: <span th:text="${patient.age}"></span> | Village: <span th:text="${patient.village}"></span> | Phone: <span th:text="${patient.phone}"></span></p>
                            <p>Diagnosis: <span th:text="${patient.diagnosis}"></span></p>
                            <a th:href="@{/patients/delete/{id}(id=${patient.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to remove this patient?')">Remove</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

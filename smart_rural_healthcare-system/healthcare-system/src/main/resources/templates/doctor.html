<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctors - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Patients</a>
                <a class="nav-link active" href="/doctors">Doctors</a>
                <a class="nav-link" href="/appointments">Appointments</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="bi bi-person-lines-fill text-primary"></i> Doctors List</h2>
                    <a href="/doctors/new" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Add Doctor
                    </a>
                </div>

                <div th:if="${listDoctors.isEmpty}">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> No doctors registered yet. <a href="/doctors/new">Add the first doctor</a>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover" th:if="${not #lists.isEmpty(listDoctors)}">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Specialty</th>
                                <th>Phone</th>
                                <th>Hospital</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="doctor : ${listDoctors}">
                                <td th:text="${doctor.id}"></td>
                                <td th:text="${doctor.name}"></td>
                                <td>
                                    <span class="badge bg-success" th:text="${doctor.specialty}"></span>
                                </td>
                                <td th:text="${doctor.phone}"></td>
                                <td th:text="${doctor.hospital}"></td>
                                <td>
                                    <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/doctors/{id}(id=${doctor.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

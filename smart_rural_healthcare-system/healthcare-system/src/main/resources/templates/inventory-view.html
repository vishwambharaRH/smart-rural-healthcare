<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Medicine Details - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/dashboard">Dashboard</a>
                <a class="nav-link" href="/inventory/list">Inventory</a>
                <a class="nav-link" href="/prescription/list">Prescriptions</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Medicine Details</h4>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <tr>
                                <th>Medicine Name:</th>
                                <td th:text="${medicine.medicineName}">-</td>
                            </tr>
                            <tr>
                                <th>Batch Number:</th>
                                <td th:text="${medicine.batchNumber}">-</td>
                            </tr>
                            <tr>
                                <th>Quantity:</th>
                                <td th:text="${medicine.quantity}">0</td>
                            </tr>
                            <tr>
                                <th>Expiry Date:</th>
                                <td th:text="${medicine.expiryDate}">-</td>
                            </tr>
                            <tr>
                                <th>Location:</th>
                                <td th:text="${medicine.location}">-</td>
                            </tr>
                            <tr>
                                <th>Specialty:</th>
                                <td th:text="${medicine.specialty}">-</td>
                            </tr>
                            <tr>
                                <th>Cost per Unit:</th>
                                <td th:text="${medicine.costPerUnit}">-</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Actions</h5>
                    </div>
                    <div class="card-body">
                        <a th:href="@{/inventory/edit/{id}(id=${medicine.id})}" class="btn btn-warning btn-block w-100 mb-2">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        
                        <form method="POST" th:action="@{/inventory/use/{id}(id=${medicine.id})}" class="mb-2">
                            <div class="input-group">
                                <input type="number" name="quantity" class="form-control" placeholder="Qty to use" min="1" required>
                                <button type="submit" class="btn btn-danger">Use</button>
                            </div>
                        </form>

                        <form method="POST" th:action="@{/inventory/add-stock/{id}(id=${medicine.id})}" class="mb-2">
                            <div class="input-group">
                                <input type="number" name="quantity" class="form-control" placeholder="Qty to add" min="1" required>
                                <button type="submit" class="btn btn-success">Add Stock</button>
                            </div>
                        </form>

                        <form method="POST" th:action="@{/inventory/delete/{id}(id=${medicine.id})}" class="mb-2">
                            <button type="submit" class="btn btn-danger w-100" onclick="return confirm('Are you sure?')">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <a href="/inventory/list" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back to List
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Prescriptions - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/dashboard">Inventory</a>
                <a class="nav-link active" href="/prescription/list">Prescriptions</a>
                <a class="nav-link" href="/diagnosis/list">Diagnoses</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h2><i class="bi bi-file-earmark-medical text-primary"></i> Prescriptions</h2>
                    <a href="/diagnosis/list" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> New Diagnosis
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(prescriptions)}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> No prescriptions found. <a href="/diagnosis/list">Start by creating a diagnosis</a>
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(prescriptions)}">
            <table class="table table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Diagnosis</th>
                        <th>Medicines</th>
                        <th>Dosage</th>
                        <th>Duration (Days)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rx : ${prescriptions}">
                        <td th:text="${rx.id}">-</td>
                        <td th:text="${rx.diagnosis.diagnosis}">-</td>
                        <td th:text="${rx.medicines}">-</td>
                        <td th:text="${rx.dosage}">-</td>
                        <td th:text="${rx.durationDays}">-</td>
                        <td>
                            <a th:href="@{/prescription/view/{id}(id=${rx.id})}" class="btn btn-sm btn-info">
                                <i class="bi bi-eye"></i> View
                            </a>
                            <a th:href="@{/prescription/edit/{id}(id=${rx.id})}" class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

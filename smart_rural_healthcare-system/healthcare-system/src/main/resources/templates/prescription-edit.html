<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Prescription - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/dashboard">Inventory</a>
                <a class="nav-link" href="/prescription/list">Prescriptions</a>
                <a class="nav-link" href="/diagnosis/list">Diagnoses</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-pencil-square"></i> Edit Prescription
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" th:action="@{/prescription/edit/{id}(id=${prescription.id})}">
                            <div class="mb-3">
                                <label for="medicines" class="form-label">Medicines (comma-separated)</label>
                                <textarea name="medicines" class="form-control" id="medicines" rows="3" required><span th:text="${prescription.medicines}"></span></textarea>
                                <small class="text-muted">List all medicines to be prescribed</small>
                            </div>

                            <div class="mb-3">
                                <label for="dosage" class="form-label">Dosage</label>
                                <input type="text" name="dosage" class="form-control" id="dosage" th:value="${prescription.dosage}" required>
                            </div>

                            <div class="mb-3">
                                <label for="instructions" class="form-label">Special Instructions</label>
                                <textarea name="instructions" class="form-control" id="instructions" rows="3"><span th:text="${prescription.instructions}"></span></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="durationDays" class="form-label">Duration (Days)</label>
                                <input type="number" name="durationDays" class="form-control" id="durationDays" min="1" th:value="${prescription.durationDays}" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Save Changes
                                </button>
                                <a th:href="@{/prescription/view/{id}(id=${prescription.id})}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

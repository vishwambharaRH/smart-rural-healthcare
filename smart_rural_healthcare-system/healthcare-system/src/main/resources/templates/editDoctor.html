<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Doctor - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Edit Doctor</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/doctors}" th:object="${doctor}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" th:field="*{name}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" th:field="*{phone}" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Specialty</label>
                                <input type="text" th:field="*{specialty}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Hospital</label>
                                <input type="text" th:field="*{hospital}" class="form-control">
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" th:field="*{available}" class="form-check-input" id="available">
                                <label class="form-check-label" for="available">Available</label>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Doctor</button>
                            <a th:href="@{/doctors}" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

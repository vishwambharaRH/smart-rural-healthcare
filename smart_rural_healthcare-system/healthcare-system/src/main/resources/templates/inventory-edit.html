<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Medicine - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Rural Health
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/inventory/dashboard">Dashboard</a>
                <a class="nav-link" href="/inventory/list">Inventory</a>
                <a class="nav-link" href="/prescription/list">Prescriptions</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-pencil-square"></i> Edit Medicine
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" th:action="@{/inventory/edit/{id}(id=${medicine.id})}">
                            <div class="mb-3">
                                <label for="medicineName" class="form-label">Medicine Name</label>
                                <input type="text" name="medicineName" class="form-control" id="medicineName" th:value="${medicine.medicineName}" required>
                            </div>
                            <div class="mb-3">
                                <label for="batchNumber" class="form-label">Batch Number</label>
                                <input type="text" name="batchNumber" class="form-control" id="batchNumber" th:value="${medicine.batchNumber}" required>
                            </div>
                            <div class="mb-3">
                                <label for="expiryDate" class="form-label">Expiry Date</label>
                                <input type="date" name="expiryDate" class="form-control" id="expiryDate" th:value="${medicine.expiryDate}">
                            </div>
                            <div class="mb-3">
                                <label for="quantity" class="form-label">Quantity</label>
                                <input type="number" name="quantity" class="form-control" id="quantity" th:value="${medicine.quantity}" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label for="location" class="form-label">Location (Village/Camp)</label>
                                <input type="text" name="location" class="form-control" id="location" th:value="${medicine.location}" required>
                            </div>
                            <div class="mb-3">
                                <label for="specialty" class="form-label">Specialty (Optional)</label>
                                <select name="specialty" class="form-select" id="specialty">
                                    <option value="">Select specialty</option>
                                    <option value="General" th:selected="${medicine.specialty == 'General'}">General</option>
                                    <option value="Cardiology" th:selected="${medicine.specialty == 'Cardiology'}">Cardiology</option>
                                    <option value="Pediatrics" th:selected="${medicine.specialty == 'Pediatrics'}">Pediatrics</option>
                                    <option value="Orthopedics" th:selected="${medicine.specialty == 'Orthopedics'}">Orthopedics</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="costPerUnit" class="form-label">Cost per Unit (Optional)</label>
                                <input type="number" name="costPerUnit" class="form-control" id="costPerUnit" th:value="${medicine.costPerUnit}" step="0.01" min="0">
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Save Changes
                                </button>
                                <a th:href="@{/inventory/view/{id}(id=${medicine.id})}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

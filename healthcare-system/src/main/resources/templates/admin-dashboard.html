<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); min-height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #map { height: 400px; border-radius: 10px; }
        .stat-card { background: linear-gradient(45deg, #667eea, #764ba2); color: white; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 pt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-white mb-4">
                    <i class="bi bi-shield-check"></i> Admin Dashboard
                </h1>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <i class="bi bi-people display-4 opacity-75"></i>
                        <h2 th:text="${totalUsers}">0</h2>
                        <p class="mb-0">Total Users</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <i class="bi bi-heart-pulse display-4 opacity-75"></i>
                        <h2 th:text="${totalPatients}">0</h2>
                        <p class="mb-0">Patients</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <i class="bi bi-stethoscope display-4 opacity-75"></i>
                        <h2 th:text="${totalDoctors}">0</h2>
                        <p class="mb-0">Doctors</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <i class="bi bi-calendar3 display-4 opacity-75"></i>
                        <h2 th:text="${totalAppointments}">0</h2>
                        <p class="mb-0">Appointments</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Users Management -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card text-white bg-dark">
                    <div class="card-header">
                        <h5><i class="bi bi-person-lines-fill"></i> All Users</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-dark table-hover">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Name</th>
                                    <th>Role</th>
                                    <th>Village</th>
                                    <th>Phone</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${#lists.empty(users) ? ${patients} : ${users}}">
                                    <td th:text="${user.username ?: user.patientId}"></td>
                                    <td th:text="${user.name}"></td>
                                    <td>
                                        <span class="badge" th:text="${user.role?.name() ?: 'PATIENT'}" 
                                              th:classappend="${user.role?.name() == 'ADMIN' ? 'bg-danger' : 'bg-info'}"></span>
                                    </td>
                                    <td th:text="${user.village}"></td>
                                    <td th:text="${user.phone}"></td>
                                    <td>
                                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-warning">Edit</a>
                                        <a th:href="@{/users/delete/{id}(id=${user.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-light">
                    <div class="card-header">
                        <h5><i class="bi bi-plus-circle"></i> Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <a href="/register" class="btn btn-success w-100 mb-2">Add User</a>
                        <a href="/patients" class="btn btn-info w-100 mb-2">Manage Patients</a>
                        <a href="/doctors" class="btn btn-primary w-100 mb-2">Manage Doctors</a>
                        <a href="/medicines" class="btn btn-danger w-100 mb-2">Manage Medicines</a>
                        <a href="/camps" class="btn btn-warning w-100">Manage Camps</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Other Data -->
        <div class="row">
            <div class="col-md-6">
                <div class="card text-dark bg-light">
                    <div class="card-header">
                        <h5><i class="bi bi-capsule-pill"></i> Medicines Inventory</h5>
                    </div>
                    <div class="card-body">
                        <div th:each="medicine : ${medicines}">
                            <div class="d-flex justify-content-between">
                                <span th:text="${medicine.name}"></span>
                                <span th:text="${medicine.quantity} + ' units'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-dark bg-light">
                    <div class="card-header">
                        <h5><i class="bi bi-geo-alt"></i> Upcoming Camps</h5>
                    </div>
                    <div class="card-body">
                        <div th:each="camp : ${camps}" class="mb-2">
                            <h6 th:text="${camp.location}"></h6>
                            <small th:text="${camp.startDate} + ' - ' + ${camp.endDate}"></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>

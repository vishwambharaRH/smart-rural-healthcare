<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="navbar">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-heart-pulse"></i> RuralCare
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/}">Home</a>
        </li>
      </ul>
      
      <ul class="navbar-nav">
        <li class="nav-item" th:if="${#authentication != null and #authentication.name != null and #lists.contains(#authentication.authorities, 'ROLE_DOCTOR')}">
          <a class="nav-link" th:href="@{/doctor-dashboard}">
            <i class="bi bi-stethoscope"></i> Doctor Dashboard
          </a>
        </li>
        <li class="nav-item" th:if="${#authentication != null and #authentication.name != null and #lists.contains(#authentication.authorities, 'ROLE_USER')}">
          <a class="nav-link" th:href="@{/patient-dashboard}">
            <i class="bi bi-heart-pulse"></i> Patient Dashboard
          </a>
        </li>
        <li class="nav-item dropdown" th:if="${#authentication != null and #lists.contains(#authentication.authorities, 'ROLE_HEALTHWORKER')}">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-badge"></i> Healthworker
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/healthworker-dashboard}">Dashboard</a></li>
            <li><a class="dropdown-item" th:href="@{/healthworker-functionalities}">Functionalities</a></li>
          </ul>
        </li>
        <li class="nav-item" th:if="${#authentication != null and #lists.contains(#authentication.authorities, 'ROLE_ADMIN')}">
          <a class="nav-link" th:href="@{/admin-dashboard}">
            <i class="bi bi-gear"></i> Admin
          </a>
        </li>
      </ul>
      
      <ul class="navbar-nav ms-3">
        <li class="nav-item" th:if="${#authentication?.name != null}">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i>
            <span th:text="${#authentication.name ?: 'User'}"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/profile">Profile</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" th:href="@{/logout}">Logout</a></li>
          </ul>
        </li>
        <li class="nav-item" th:unless="${#authentication?.name != null}">
          <a class="nav-link" th:href="@{/login}">Login</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Health Worker Functionalities - RuralCare</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); min-height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .section-card { min-height: 300px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 pt-4">
        <h1 class="text-success mb-4">
            <i class="bi bi-gear-heart"></i> Health Worker Functionalities
        </h1>
        
        <div class="row g-4">
            <!-- Add New Camp -->
            <div class="col-lg-4">
                <div class="card section-card">
                    <div class="card-header bg-success text-white">
                        <h5><i class="bi bi-calendar-plus"></i> Schedule New Camp</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/healthworker/save-camp}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Village</label>
                                <input type="text" class="form-control" name="village" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" class="form-control" name="campDate" required>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <label class="form-label">Start Time</label>
                                    <input type="time" class="form-control" name="startTime" required>
                                </div>
                                <div class="col">
                                    <label class="form-label">End Time</label>
                                    <input type="time" class="form-control" name="endTime" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Doctor</label>
                                <input type="text" class="form-control" name="doctorName" placeholder="Doctor name">
                            </div>
                            <button type="submit" class="btn btn-success w-100 mt-3">
                                <i class="bi bi-calendar-check"></i> Schedule Camp
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Update Medicine Inventory -->
            <div class="col-lg-4">
                <div class="card section-card">
                    <div class="card-header bg-primary text-white">
                        <h5><i class="bi bi-capsule-pill"></i> Update Inventory</h5>
                    </div>
                    <div class="card-body">
                        <h6>Quick Stock Update</h6>
                        <div th:each="medicine : ${medicines}" class="mb-2">
                            <small th:text="${medicine.medicineName}">Medicine</small>
                            <input type="number" class="form-control form-control-sm" th:value="${medicine.quantity}" placeholder="Qty">
                            <button class="btn btn-sm btn-outline-primary mt-1 w-100">Update</button>
                        </div>
                        <div th:if="${medicines.isEmpty()}">
                            No medicines. <a href="#">Add new?</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Patient Outreach -->
            <div class="col-lg-4">
                <div class="card section-card">
                    <div class="card-header bg-info text-white">
                        <h5><i class="bi bi-telephone"></i> Patient Outreach</h5>
                    </div>
                    <div class="card-body">
                        <div th:each="patient : ${patients}" class="mb-2 p-2 border rounded">
                            <div class="d-flex justify-content-between">
                                <span th:text="${patient.name}"></span>
                                <button class="btn btn-sm btn-success" onclick="copyToClipboard('${patient.phone}')">
                                    <i class="bi bi-telephone"></i>
                                </button>
                            </div>
                            <small th:text="${patient.village}"></small>
                            <div class="form-check mt-1">
                                <input class="form-check-input" type="checkbox" id="contacted_${patient.id}">
                                <label class="form-check-label small" for="contacted_${patient.id}">Contacted</label>
                            </div>
                        </div>
                        <div th:if="${patients.isEmpty()}">
                            No patients.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <a href="/healthworker-dashboard" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function copyToClipboard(phone) {
            navigator.clipboard.writeText(phone).then(() => alert('Phone copied!'));
        }
    </script>
</body>
</html>

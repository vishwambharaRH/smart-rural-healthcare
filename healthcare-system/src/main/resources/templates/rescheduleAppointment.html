<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reschedule Appointment - Smart Rural Healthcare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">
                            <i class="bi bi-calendar3-week"></i> Reschedule Appointment
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/appointments/reschedule}" th:object="${appointment}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Doctor</label>
                                    <input type="text" th:value="${appointment.doctor.name} + ' (' + ${appointment.doctor.specialty} + ')'" class="form-control" readonly />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">New Date & Time</label>
                                    <input type="datetime-local" th:field="*{appointmentDate}" class="form-control" required />
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Reason</label>
                                <textarea th:field="*{reason}" class="form-control" rows="3" required></textarea>
                            </div>
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit" class="btn btn-warning">
                                    <i class="bi bi-check-circle"></i> Reschedule Appointment
                                </button>
                                <a th:href="@{/patient-dashboard}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
